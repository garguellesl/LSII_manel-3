name: Pull Request CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test -- --coverage --watchAll=false --ci

      - name: Set up Java for backend
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Install Maven Wrapper
        working-directory: backend
        run: mvn -N io.takari:maven:wrapper

      - name: Build production jar and test with PostgreSQL
        working-directory: backend
        run: |
          ./mvnw -Pprod clean verify

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      # Upload Frontend Coverage
      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          if-no-files-found: error

      # Upload Backend Coverage
      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    # 25 min for the normal suite + ~10 min for the RF-8 persistence check
    # appended below (seed -> force-recreate -> verify, specs/sprint-3/persistence.md).
    timeout-minutes: 35

    env:
      PROTUBE_HTTP_PORT: '18080'
      ENV_PROTUBE_DB_PORT: '15432'
      ENV_PROTUBE_DB_USER: protube_e2e
      ENV_PROTUBE_DB_PASS: e2e_test_only
      ENV_PROTUBE_DB: protube_e2e
      ENV_PROTUBE_SESSION_SECURE: 'false'
      ENV_PROTUBE_WEB_ORIGINS: http://localhost:18080
      ENV_PROTUBE_DEMO_ADMIN_EMAIL: admin@protube.local
      ENV_PROTUBE_DEMO_ADMIN_ACCOUNT: admin
      ENV_PROTUBE_DEMO_ADMIN_PASSWORD: admin1234

    steps:
      # actions/checkout@v7, actions/setup-node@v7 and actions/upload-artifact@v7
      # already run on the node24 Actions runtime (checkout and setup-node since
      # v5.0.0, upload-artifact by default since v6.0.0); node-version below stays
      # at 22 to match the rest of the project, that setting is independent of the
      # runtime the actions themselves execute under.
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js for E2E
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium

      - name: Start isolated E2E deployment
        run: docker compose -p protube-e2e -f compose.yaml -f e2e/compose.override.yml up -d --wait --build

      - name: Run E2E tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:18080
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: warn

      # RF-8 persistence check (specs/sprint-3/persistence.md): appended to
      # this job, not a separate one, so it reuses the image and the stack
      # already built/started above instead of paying for a second --build
      # on a fresh runner. Runs after the normal suite's own report upload,
      # so the normal suite's result/report never depends on this passing.
      - name: Seed persistence fixtures (RF-8)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:18080
        run: npx playwright test --config=persistence/playwright.config.ts seed.spec.ts

      - name: Recreate containers without deleting volumes (RF-8)
        run: |
          COMPOSE="docker compose -p protube-e2e -f compose.yaml -f e2e/compose.override.yml"
          APP_ID_BEFORE=$($COMPOSE ps -q app)
          DB_ID_BEFORE=$($COMPOSE ps -q db)
          $COMPOSE up -d --force-recreate --wait
          APP_ID_AFTER=$($COMPOSE ps -q app)
          DB_ID_AFTER=$($COMPOSE ps -q db)
          if [ "$APP_ID_BEFORE" = "$APP_ID_AFTER" ]; then
            echo "ERROR: app container was not recreated" >&2
            exit 1
          fi
          if [ "$DB_ID_BEFORE" = "$DB_ID_AFTER" ]; then
            echo "ERROR: db container was not recreated" >&2
            exit 1
          fi
          echo "app: $APP_ID_BEFORE -> $APP_ID_AFTER"
          echo "db:  $DB_ID_BEFORE -> $DB_ID_AFTER"

      - name: Verify persistence after recreation (RF-8)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:18080
        run: npx playwright test --config=persistence/playwright.config.ts verify.spec.ts

      - name: Upload persistence report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: persistence-report
          # Playwright resolves the html reporter's outputFolder relative to
          # persistence/playwright.config.ts, not to e2e/.
          path: e2e/persistence/persistence-report/
          if-no-files-found: ignore

      - name: Tear down isolated E2E deployment
        if: always()
        run: docker compose -p protube-e2e -f compose.yaml -f e2e/compose.override.yml down -v

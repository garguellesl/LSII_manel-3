services:
  app:
    image: "${PROTUBE_IMAGE:-protube:local}"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ENV_PROTUBE_DB_HOST: "${SUPABASE_DB_HOST:?Set SUPABASE_DB_HOST in .env}"
      ENV_PROTUBE_DB_PORT: "${SUPABASE_DB_PORT:-5432}"
      ENV_PROTUBE_DB_USER: "${SUPABASE_DB_USER:?Set SUPABASE_DB_USER in .env}"
      ENV_PROTUBE_DB_PASS: "${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in .env}"
      ENV_PROTUBE_DB: "${SUPABASE_DB_NAME:-postgres}"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://${SUPABASE_DB_HOST:?Set SUPABASE_DB_HOST in .env}:${SUPABASE_DB_PORT:-5432}/${SUPABASE_DB_NAME:-postgres}?sslmode=require&currentSchema=protube"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "3"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "0"
      SPRING_FLYWAY_DEFAULT_SCHEMA: protube
      SPRING_FLYWAY_SCHEMAS: protube
      SPRING_APPLICATION_JSON: '{"spring":{"jpa":{"properties":{"hibernate.default_schema":"protube"}}}}'
      ENV_PROTUBE_STORE_DIR: /media-store/
      ENV_PROTUBE_IMPORT_DIR: /media-store/imports
      ENV_PROTUBE_SESSION_SECURE: "${ENV_PROTUBE_SESSION_SECURE:-false}"
      ENV_PROTUBE_WEB_ORIGINS: "${ENV_PROTUBE_WEB_ORIGINS:-http://localhost:8080}"
      ENV_PROTUBE_DEMO_ADMIN_EMAIL: "${ENV_PROTUBE_DEMO_ADMIN_EMAIL:-admin@protube.local}"
      ENV_PROTUBE_DEMO_ADMIN_ACCOUNT: "${ENV_PROTUBE_DEMO_ADMIN_ACCOUNT:-admin}"
      ENV_PROTUBE_DEMO_ADMIN_PASSWORD: ""
    # Shared data already exists in Supabase; do not import or provision a demo account.
    command: ["--pro_tube.load_initial_data=false"]
    ports:
      - "${PROTUBE_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${PROTUBE_MEDIA_DIR:-./videos}
        target: /media-store/imports
        read_only: true
        bind:
          create_host_path: false
      # Writable store; imported originals are mounted read-only in its imports subdirectory.
      - type: volume
        source: uploaded_media
        target: /media-store
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/videos?page=0&size=1"]
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 30s

volumes:
  uploaded_media:

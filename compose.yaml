services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: "${ENV_PROTUBE_DB_USER:-protube}"
      POSTGRES_PASSWORD: "${ENV_PROTUBE_DB_PASS:-admin}"
      POSTGRES_DB: "${ENV_PROTUBE_DB:-protube}"
    ports:
      - "${ENV_PROTUBE_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: protube:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ENV_PROTUBE_DB_HOST: db
      ENV_PROTUBE_DB_PORT: "5432"
      ENV_PROTUBE_DB_USER: "${ENV_PROTUBE_DB_USER:-protube}"
      ENV_PROTUBE_DB_PASS: "${ENV_PROTUBE_DB_PASS:-admin}"
      ENV_PROTUBE_DB: "${ENV_PROTUBE_DB:-protube}"
      ENV_PROTUBE_STORE_DIR: /media-store/
    # Import existing sample triples; the importer skips videos already in PostgreSQL.
    command: ["--pro_tube.load_initial_data=true"]
    ports:
      - "${PROTUBE_HTTP_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${PROTUBE_MEDIA_DIR:-./videos}
        target: /media-store
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/videos"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres_data:
